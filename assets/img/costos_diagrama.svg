<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Chivo, system-ui, sans-serif">
  <title>Materias primas, selección de variables, OLS y ARIMA, Monte Carlo y agente</title>
  <line x1="120" y1="300" x2="1080" y2="300" stroke="#a89ea4" stroke-width="1"/>
  <g fill="none" stroke="#ff4d8d" stroke-width="2">
    <circle cx="120" cy="300" r="28" fill="#0f0a0e"/>
    <circle cx="360" cy="300" r="28" fill="#0f0a0e"/>
    <circle cx="600" cy="300" r="28" fill="#0f0a0e"/>
    <circle cx="840" cy="300" r="28" fill="#0f0a0e"/>
    <circle cx="1080" cy="300" r="28" fill="#0f0a0e"/>
  </g>
  <g fill="#ff4d8d" font-size="18" text-anchor="middle" font-weight="500">
    <text x="120" y="306">01</text><text x="360" y="306">02</text><text x="600" y="306">03</text><text x="840" y="306">04</text><text x="1080" y="306">05</text>
  </g>
  <g fill="#f6f1f4" font-size="22" text-anchor="middle">
    <text x="120" y="370">Materias primas</text>
    <text x="360" y="370">Selección de variables</text>
    <text x="600" y="370">OLS y ARIMA</text>
    <text x="840" y="370">Monte Carlo</text>
    <text x="1080" y="370">Agente</text>
  </g>
  <g fill="#a89ea4" font-size="16" text-anchor="middle">
    <text x="120" y="400">series mensuales</text>
    <text x="600" y="400">pronóstico</text>
    <text x="840" y="400">intervalos</text>
    <text x="1080" y="400">responde</text>
  </g>
</svg>
